name: Build Friend iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          xcodebuild \
            -project Friend.xcodeproj \
            -scheme Friend \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          app_path="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          mkdir Payload
          cp -R "$app_path" Payload/
          zip -qry Friend.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: friend-ipa-${{ github.sha }}
          path: Friend.ipa
